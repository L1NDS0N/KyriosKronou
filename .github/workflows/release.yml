name: Build and Release

# Publicar é automático: todo merge na master vira uma release com tag,
# changelog e os assets gerados aqui.
#
# O paths-ignore não é decoração. O passo "Commit version and create release
# tag" grava package.json, package-lock.json e CHANGELOG.md de volta na master,
# e isso dispararia este workflow outra vez - que bumparia a versão outra vez,
# para sempre. O GitHub só pula o workflow quando TODOS os arquivos alterados
# estão na lista, então um commit de release (que mexe só nesses três) não
# recria release, e um commit de feature continua disparando.
on:
  push:
    branches: [master]
    paths-ignore:
      - CHANGELOG.md
      - package.json
      - package-lock.json
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (leave empty to bump patch automatically)'
        required: false
        type: string
      publish:
        description: 'Commit the version, create the tag and publish the GitHub Release'
        required: true
        default: true
        type: boolean
      prerelease:
        description: 'Mark the GitHub Release as a prerelease'
        required: false
        default: false
        type: boolean
      draft:
        description: 'Create the GitHub Release as a draft'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Testes e build correm em paralelo. A build é a etapa longa - baixa o
  # Electron, compila o instalador - e esperar a suíte antes de começar custava
  # minutos sem mudar o resultado.
  #
  # O que garante que um teste vermelho não publica nada é o job `publish`, que
  # depende dos dois. A build acontece, os artefatos sobem, e no fim ninguém
  # tagueia nem cria release porque `needs` falhou.
  test:
    name: Tests
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm test` precisa falhar o job. Um `|| true` aqui transformaria toda
      # suíte vermelha em pipeline verde - e o job publish acharia que pode
      # publicar.
      - name: Run tests
        run: npm test

  build:
    name: Build Windows artifacts
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    env:
      NODE_VERSION: '20'
      # electron-builder downloads Electron, the winCodeSign helpers and the NSIS
      # binaries into these; without a stable path the release run re-downloads
      # ~400 MB that the previous run already cached.
      ELECTRON_CACHE: ${{ github.workspace }}\.cache\electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.cache\electron-builder
    steps:
      - name: Checkout source and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # Keyed by the lockfile so only a dependency bump invalidates it.
      - name: Cache Electron and NSIS toolchains
        uses: actions/cache@v4
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: electron-win-x64-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-win-x64-

      - name: Resolve version and publication tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          EVENT="${{ github.event_name }}"
          REF_TYPE="${{ github.ref_type }}"
          TAG=""
          PUBLISH="false"
          NOTES_READY="false"

          if [ "$EVENT" = "push" ] && [ "$REF_TYPE" = "tag" ]; then
            # A tag chegou pronta: a versão do package.json tem de ser exatamente
            # essa, senão o instalador seria gravado com um número e a release
            # levaria outro.
            TAG="${GITHUB_REF_NAME}"
            PACKAGE_VERSION=$(node -p "require('./package.json').version")
            if [ "$TAG" != "v$PACKAGE_VERSION" ]; then
              echo "Tag $TAG does not match package.json version $PACKAGE_VERSION." >&2
              exit 1
            fi
          elif [ "$EVENT" = "push" ] || [ "${{ inputs.publish }}" = "true" ]; then
            if [ "$REF_TYPE" = "tag" ]; then
              echo "Publish must be dispatched from a branch, not a tag." >&2
              exit 1
            fi
            CURRENT=$(node -p "require('./package.json').version")
            if [ -n "${{ inputs.version }}" ]; then
              VERSION="${{ inputs.version }}"
            else
              VERSION=$(node scripts/generate-changelog.js --print-next)
            fi
            if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Release version must use MAJOR.MINOR.PATCH, received: $VERSION" >&2
              exit 1
            fi
            TAG="v$VERSION"
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              # A execução anterior tagueou e morreu antes de publicar a release.
              # Reaproveitar a tag é o que impede cada re-run de subir a versão.
              echo "A tag $TAG ja existe; reaproveitando em vez de subir a versao."
            else
              npm version "$VERSION" --no-git-tag-version --allow-same-version
              node scripts/generate-changelog.js --version "$VERSION" --output CHANGELOG.md --notes-output release-notes.md
              NOTES_READY="true"
            fi
            PUBLISH="true"
          fi

          echo "tag=$TAG" >> "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "notes_ready=$NOTES_READY" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y
# -SkipTests: a suíte roda no job `test`, em paralelo com este. Rodar de
      # novo aqui seria duplicar os minutos mais caros do pipeline sem
      # encontrar nada que o outro job não tenha encontrado.
      - name: Build installer
        shell: pwsh
        run: .\Build-Installer.ps1 -SkipTests

      # O instalador é montado pelo NSIS a partir do .nsi, e esse caminho não é
      # o do electron-builder: sem este passo a release vai sem latest.yml e o
      # atualizador do app não tem como saber que existe uma versão nova.
      - name: Generate the update manifest
        shell: bash
        # A tag vem como v1.0.2 e o manifesto quer 1.0.2: o nome do instalador
        # é montado a partir da versão, sem o "v".
        run: node scripts/generate-update-manifest.js --version "${{ steps.version.outputs.tag }}" --quiet

      # Quando a tag chega pronta em vez de ser bumpeada aqui, o changelog ainda
      # não existe. Precisa ser escrito antes do upload, senão o publish recebe
      # um artefato sem release-notes.md e o `--notes-file` aponta para nada.
      - name: Generate release notes when the tag arrived ready
        if: steps.version.outputs.notes_ready != 'true' && steps.version.outputs.tag != ''
        shell: bash
        run: node scripts/generate-changelog.js --tag "${{ steps.version.outputs.tag }}" --output CHANGELOG.md --notes-output release-notes.md

            # package.json e o lockfile vão junto porque o bump de versão aconteceu
      # neste job. O publish faz checkout limpo da master e precisa receber os
      # dois para poder commitar a versão - sem eles o `git commit` seria vazio
      # e falharia.
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kyrios-chronos-${{ steps.version.outputs.tag || 'build' }}
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/*.exe
            dist/latest.yml
            CHANGELOG.md
            release-notes.md
            package.json
            package-lock.json

  # Só chega aqui com os dois jobs acima verdes. É este `needs` que impede um
  # teste vermelho de virar uma release publicada: a build pode ter terminado e
  # os artefatos podem ter subido, mas ninguém tagueia nem publica.
  publish:
    name: Tag and publish the GitHub Release
    needs: [test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          # O bot commita por cima do que está na origin/master.
          token: ${{ github.token }}

      - name: Download the built artifacts
        uses: actions/download-artifact@v4
        with:
          name: kyrios-chronos-${{ needs.build.outputs.tag || 'build' }}
          path: dist

      # O job de build bumpeou a versão no workspace dele, e aqui o checkout
      # está limpo. Sem restaurar os arquivos o commit de release seria vazio.
      - name: Restore the bumped version into the checkout
        shell: bash
        run: |
          set -euo pipefail
          for arquivo in package.json package-lock.json CHANGELOG.md; do
            if [ -f "dist/$arquivo" ]; then
              cp "dist/$arquivo" "$arquivo"
            fi
          done
          node -p "'versao a publicar: ' + require('./package.json').version"

      - name: Commit version and create release tag
        if: needs.build.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.build.outputs.tag }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json CHANGELOG.md
          # O commit de release só mexe nesses três arquivos, que são os
          # paths-ignore do gatilho: ele não recria esta release.
          git commit -m "chore(release): $TAG"
          git tag -a "$TAG" -m "Kyrios Chronos $TAG"
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "$TAG"

      - name: Summarize the release in the job summary
        if: needs.build.outputs.tag != ''
        shell: bash
        run: |
          {
            echo "## Kyrios Chronos ${{ needs.build.outputs.tag }}"
            echo
            cat dist/release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attach artifacts to GitHub Release
        if: needs.build.outputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # O nome da variável é RELEASE_TAG, não TAG: um `TAG` no env: colide
          # com a variável que o runner já exporta e chega vazio no script, e
          # com `set -u` isso mata a etapa antes do primeiro comando.
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease || false }}
          DRAFT: ${{ inputs.draft || false }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          mapfile -t ASSETS < <(find dist -maxdepth 1 -type f \( -name '*.exe' -o -name '*.blockmap' -o -name 'latest.yml' \) | sort)
          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "No release assets were produced." >&2
            exit 1
          fi
          FLAGS=(--title "Kyrios Chronos $TAG" --notes-file dist/release-notes.md)
          if [ "$PRERELEASE" = "true" ]; then FLAGS+=(--prerelease); fi
          if [ "$DRAFT" = "true" ]; then FLAGS+=(--draft); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" "${FLAGS[@]}"
          else
            gh release create "$TAG" "${ASSETS[@]}" "${FLAGS[@]}" --verify-tag
          fi
