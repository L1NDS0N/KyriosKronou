<!doctype html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="../../src/renderer/style.css"></head>
<body>
  <div id="retention-content"></div>
  <div id="modal-overlay" class="hidden"><div id="modal-content"><div id="modal-body"></div></div></div>
  <div id="toast-container"></div>
  <script>
    window.__toasts = [];
    window.__modalCalls = 0;
    window.lucide = { createIcons() {} };
    window.PathInput = { attachAll() {}, close() {} };
    window.showModal = html => {
      window.__modalCalls++;
      document.getElementById('modal-body').innerHTML = html;
      document.getElementById('modal-overlay').classList.remove('hidden');
    };
    window.hideModal = () => document.getElementById('modal-overlay').classList.add('hidden');
    window.showToast = (message, type) => window.__toasts.push({ message, type });
  </script>
  <script src="../../src/renderer/i18n.js"></script>
  <script src="../../src/renderer/retentionPage.js"></script>
</body>
</html>
