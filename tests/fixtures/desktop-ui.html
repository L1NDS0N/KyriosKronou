<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>desktop ui fixture</title>
  <link rel="stylesheet" href="../../src/renderer/style.css">
</head>
<body>
  <div id="app">
    <nav id="sidebar">
      <button class="nav-btn active" data-page="dashboard">Dashboard</button>
      <button class="nav-btn" data-page="tasks">Tasks</button>
      <button class="nav-btn" data-page="history">History</button>
      <button class="nav-btn" data-page="logs">Logs</button>
      <button class="nav-btn" data-page="settings">Settings</button>
    </nav>
    <main id="content">
      <header id="topbar">
        <h1 id="page-title">Dashboard</h1>
        <button class="icon-btn" id="btn-refresh"></button>
      </header>
      <div id="page-container">
        <section id="page-dashboard" class="page active">
          <div class="glass-card sched-card" id="sched-card">
            <div class="sched-indicator" id="sched-indicator"></div>
            <div class="sched-text"><div class="sched-title" id="sched-title"></div><div class="sched-detail" id="sched-detail"></div></div>
            <div class="sched-actions" id="sched-actions"></div>
          </div>
          <div class="stat-card"><div class="stat-value" id="stat-active">0</div><div class="stat-sub" id="stat-active-sub"></div></div>
          <div class="stat-card"><div class="stat-value" id="stat-backups">0</div><div class="stat-sub" id="stat-backups-sub"></div></div>
          <div class="stat-card"><div class="stat-value" id="stat-next">-</div><div class="stat-sub" id="stat-next-sub"></div></div>
          <div class="stat-card"><div class="stat-value" id="stat-errors">0</div><div class="stat-sub" id="stat-errors-sub"></div></div>
          <button id="btn-open-calendar"></button>
          <div id="dash-calendar"></div>
          <table class="data-table" id="recent-table"><tbody id="recent-body"></tbody></table>
          <div class="empty-state" id="recent-empty"><p></p></div>
        </section>

        <section id="page-tasks" class="page">
          <button id="btn-new-task"></button>
          <button id="btn-import"></button>
          <button id="btn-export"></button>
          <button class="btn-ghost" id="btn-toggle-quick" aria-expanded="false" aria-controls="quick-create-panel"><span>Quick Create</span></button>
          <input type="text" id="search-tasks">
          <div id="quick-create-panel" class="quick-panel hidden">
            <div id="quick-tasks-list" class="quick-tasks-list"></div>
            <textarea id="quick-input" class="quick-textarea"></textarea>
            <div id="quick-syntax-bar" class="quick-syntax-bar"></div>
            <div id="quick-preview" class="quick-preview"></div>
            <div class="quick-status" id="quick-status"></div>
            <button id="btn-quick-clear">Clear</button>
            <button id="btn-quick-create">Create</button>
          </div>
          <div id="tasks-list"></div>
          <div class="empty-state" id="tasks-empty"></div>
        </section>

        <section id="page-services" class="page">
          <span id="services-refreshing"></span>
          <label><input type="checkbox" id="filter-managed-only"></label>
          <div id="kyrion-svc-banner-status"></div>
          <button id="btn-kyrion-svc-toggle"></button>
          <button id="btn-refresh-services"></button>
          <button id="btn-check-nssm"></button>
          <button id="btn-install-service"></button>
          <table class="data-table" id="services-table"><tbody id="services-body"></tbody></table>
          <div class="empty-state" id="services-empty"></div>
        </section>

        <section id="page-history" class="page">
          <button class="seg-btn active" data-filter="all">All</button>
          <button class="seg-btn" data-filter="24h">24h</button>
          <button class="seg-btn" data-filter="week">Week</button>
          <button class="seg-btn" data-filter="month">Month</button>
          <button id="btn-export-csv"></button>
          <table class="data-table" id="history-table"><tbody id="history-body"></tbody></table>
          <div class="empty-state" id="history-empty"></div>
        </section>

        <section id="page-logs" class="page">
          <button class="logs-tab active" data-log-tab="errors">Errors</button>
          <button class="logs-tab" data-log-tab="audit">Audit</button>
          <button class="logs-tab" data-log-tab="app">App</button>
          <button id="btn-export-logs"></button>
          <button id="btn-refresh-logs"></button>
          <div class="logs-stats" id="logs-stats"></div>
          <div id="logs-filters"></div>
          <div id="logs-table-wrap"></div>
          <div class="empty-state" id="logs-empty"></div>
        </section>

        <section id="page-settings" class="page">
          <input id="cfg-profile"><input id="cfg-nssm">
          <select id="cfg-language"><option value="en">en</option><option value="pt-BR">pt-BR</option></select>
          <button id="btn-save-settings"></button>
          <input type="checkbox" id="cfg-close-to-tray">
          <input type="checkbox" id="cfg-start-windows">
          <input type="checkbox" id="cfg-start-minimized">
          <div id="row-start-minimized"></div>
          <input type="checkbox" id="cfg-notifications">
          <input type="checkbox" id="cfg-api-enabled">
          <input type="number" id="cfg-api-port">
          <div id="api-server-status" style="display:none"><span id="api-status-badge"></span>
            <a id="api-dashboard-link"></a><a id="api-docs-link"></a></div>
          <input type="checkbox" id="cfg-api-bind-all">
          <input id="cfg-gh-client-id"><input id="cfg-gh-client-secret"><input id="cfg-web-base-url">
          <span id="oauth-callback-hint"></span>
          <div id="kyrion-svc-status"></div>
          <button id="btn-install-kyrion-svc"></button>
          <button id="btn-uninstall-kyrion-svc"></button>
          <button id="btn-restart-kyrion-svc"></button>
          <input id="gh-user-input"><button id="btn-add-gh-user"></button><div id="gh-users-list"></div>
        </section>
      </div>
    </main>
  </div>

  <div id="titlebar">
    <button id="btn-minimize"></button>
    <button id="btn-maximize"></button>
    <button id="btn-close"></button>
    <a id="credits-author" href="#">l1nds0n</a>
  </div>

  <div id="modal-overlay" class="hidden"><div id="modal-content"><div id="modal-body"></div></div></div>
  <div id="script-editor-overlay" class="secondary-modal-overlay hidden"></div>
  <div id="rich-text-overlay" class="secondary-modal-overlay hidden"></div>
  <div id="toast-container"></div>

  <script>
  // Stubs for the modules the fixture does not load. Only the pieces the code
  // under test actually calls, so a missing method shows up as a test failure
  // instead of a silently different screen.
  window.lucide = { createIcons() {} };
  window.RunMonitor = { runningBadge: () => '' };
  window.PathInput = { attachAll() {}, close() {} };
  window.simpleRichText = {
    renderPreview() {}, open() {},
    sanitize: s => s, fromText: s => s,
  };
  window.scriptEditor = { destroy() {}, open() {} };
  window.SmartCronInput = class {
    constructor(container, options) {
      this.value = options.value || '* * * * *';
      this.container = typeof container === 'string' ? document.querySelector(container) : container;
      this.onChange = options.onChange || (() => {});
      this.container.innerHTML = '<div class="smart-cron"></div>';
      this.getValue = () => this.value;
      this.isValid = () => this.value.trim().split(/\s+/).length === 5;
      this.onChange(this.value);
    }
  };
  window.KyriosCalendar = { renderMini() {}, open() {} };

  // ─── window.api ───
  const NOW = Date.now();
  const TASKS = [{
    Id: "task-1",
    Name: "Backup do João",
    CronExpression: "0 5 * * *",
    ScriptPath: "C:\\Scripts\\backup.ps1",
    Arguments: "-Full",
    Description: "Backup completo",
    Enabled: true,
  }];
  const HISTORY = Array.from({ length: 120 }, (_, i) => ({
    TaskId: "task-1",
    TaskName: "Backup do João",
    Timestamp: new Date(NOW - i * 60000).toISOString(),
    Status: i % 7 === 0 ? "Error" : "Success",
    Duration: (i + 1) + "s",
    Message: "linha " + i + " saida\nsegunda linha",
  }));
  const ERRORS = [{
    timestamp: new Date(NOW - 60000).toISOString(),
    message: "Falha ao gravar o log",
    error: { message: "EACCES denied", stack: "Error: EACCES\n  at write" },
    context: { file: "C:\\logs\\app.log" },
  }];
  const AUDIT = [{
    timestamp: new Date(NOW - 120000).toISOString(),
    action: "profile.update", actor: "l1nds0n", ipAddress: "10.0.0.9",
    target: "default", before: { port: 7600 }, after: { port: 7601 },
  }];
  const LOGS = [{
    timestamp: new Date(NOW - 30000).toISOString(), level: "info",
    message: "Agendador iniciado", meta: { pid: 1234 },
  }];

  const calls = [];
  const record = (name) => (...args) => { calls.push({ name, args }); };

  const handlers = {
    getSetting: async (key, fallback) => fallback,
    getTasks: async () => TASKS,
    getHistory: async () => HISTORY,
    getBackupProfiles: async () => [],
    getBackupHistory: async () => ({ history: [] }),
    getKyrionServiceStatus: async () => ({ nssmAvailable: true, installed: true, running: true, schedulerAlive: true, serviceName: 'KyriosChronos', status: 'Running' }),
    getNextRun: async () => new Date(NOW + 3600000).toISOString(),
    // Every accepted expression is the five-field shape with in-range values.
    validateCron: async expr => /^\S+ \S+ \S+ \S+ \S+$/.test(String(expr || '')) && !/\b(9[0-9]|2[4-9])\b/.test(String(expr || '')),
    getCronDescription: async expr => 'Runs at minute ' + String(expr).split(' ')[0],
    checkScheduleConflicts: async expr => (String(expr) === '0 5 * * *'
      ? { success: true, totalScheduled: 3, conflicts: [{ kind: 'task', name: 'Backup <noturno>', cron: '0 5 * * *', at: new Date(NOW).toISOString() }], suggestion: { expression: '7 5 * * *', minute: 7 } }
      : { success: true, totalScheduled: 3, conflicts: [] }),
    addTask: async data => { calls.push({ name: 'addTask', args: [data] }); return { success: true }; },
    getErrors: async () => ERRORS,
    getAuditLogs: async () => AUDIT,
    getLogs: async () => LOGS,
    getTraySettings: async () => ({ closeToTray: true, startWithWindows: false, startMinimized: false }),
    apiServerStatus: async () => ({ running: false, port: 7600 }),
    nssmCheckInstalled: async () => ({ installed: true }),
    getWebAccess: async () => ({ users: [] }),
    getScriptsDir: async () => 'C:\\ProgramData\\KyriosChronos\\scripts',
  };

  window.api = new Proxy({
    __calls: calls,
    __errors: [],
    reportError: (info) => { window.api.__errors.push(info); },
  }, {
    get(target, prop) {
      if (prop in target) return target[prop];
      if (typeof prop !== 'string') return undefined;
      const fn = handlers[prop];
      // Everything that answers is recorded, so a test can prove a call was
      // made instead of inferring it from the screen.
      if (fn) return (...args) => { calls.push({ name: prop, args }); return fn(...args); };
      // Anything not modelled here is a no-op that resolves empty.
      return (...args) => { calls.push({ name: prop, args }); return Promise.resolve({}); };
    },
  });
  </script>

  <script src="../../src/renderer/i18n.js"></script>
  <script src="../../src/renderer/quickCreate.js"></script>
  <script src="../../src/renderer/app.js"></script>
</body>
</html>
