<!doctype html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="../../src/renderer/style.css"></head>
<body>
  <div id="backup-profiles-list"></div>
  <div id="backup-empty" style="display:none"></div>
  <div id="modal-overlay" class="hidden"><div id="modal-content"><div id="modal-body"></div></div></div>
  <div id="toast-container"></div>
  <script>
    window.__toasts = [];
    window.__hideCalls = 0;
    window.lucide = { createIcons() {} };
    window.showModal = (html, wide) => {
      document.getElementById('modal-body').innerHTML = html;
      document.getElementById('modal-overlay').classList.remove('hidden');
      document.getElementById('modal-content').classList.toggle('wizard-wide', !!wide);
    };
    window.hideModal = () => {
      window.__hideCalls++;
      document.getElementById('modal-overlay').classList.add('hidden');
    };
    window.showToast = (message, type) => window.__toasts.push({ message, type });
  </script>
  <script src="../../src/renderer/i18n.js"></script>
  <script src="../../src/renderer/backupPage.js"></script>
</body>
</html>
