<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../../src/renderer/style.css">
</head>
<body>
  <div id="dash-calendar"></div>
  <div id="modal-overlay" class="hidden">
    <div id="modal-content"><div id="modal-body"></div></div>
  </div>
  <div id="toast-container"></div>
  <script>
    window.lucide = { createIcons() {} };
    window.showModal = html => {
      document.getElementById('modal-body').innerHTML = html;
      document.getElementById('modal-overlay').classList.remove('hidden');
    };
    window.hideModal = () => document.getElementById('modal-overlay').classList.add('hidden');
    window.showToast = () => {};
  </script>
  <script src="../../src/renderer/i18n.js"></script>
  <script src="../../src/renderer/calendar.js"></script>
</body>
</html>
